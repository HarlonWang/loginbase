name: Publish Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # gh release create 需要
      id-token: write   # npm trusted publishing（OIDC）需要
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # trusted publishing 需要 npm >= 11.5；钉死版本保证发布流水线确定性
      - name: Update npm
        run: npm install -g npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run typecheck && npm run build && npm test

      # --allow-same-version：package.json 与 tag 一致时（版本已在发版 PR 里 bump）不报错
      - name: Sync version from tag
        run: npm version "$GITHUB_REF_NAME" --no-git-tag-version --allow-same-version

      # 从旧线补丁发版（如 release/2.x 发 2.2.1）时版本低于 registry 的 latest，npm 拒绝隐式打 latest，
      # 此时打 legacy 标签；正常从 main 发版仍是 latest。只比较前三段数字。
      - name: Pick dist-tag
        run: |
          LATEST=$(npm view loginbase version)
          if node -e 'const [a,b]=process.argv.slice(1).map(v=>v.split(/[.-]/).slice(0,3).map(Number));for(let i=0;i<3;i++){if(a[i]>b[i])process.exit(0);if(a[i]<b[i])process.exit(1)}process.exit(1)' "$GITHUB_REF_NAME" "$LATEST"; then
            echo "DIST_TAG=latest" >> "$GITHUB_ENV"
          else
            echo "DIST_TAG=legacy" >> "$GITHUB_ENV"
          fi

      - name: Publish to npm
        run: npm publish --tag "$DIST_TAG"

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  # 第 4 步（KMP 客户端）时在此追加 maven job：macos runner + publishAndReleaseToMavenCentral，
  # 凭证从 HarlonWang/secrets 的 maven-publishing/ 配置到 GitHub Secrets（照抄 kmp-webview）。
